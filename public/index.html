<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base de Datos Redis - En Vivo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at top, #1e293b, #0f172a);
            color: #fff;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container { width: 100%; max-width: 1000px; }
        
        header { text-align: center; margin-bottom: 30px; }
        header h1 { font-size: 2.5em; font-weight: 700; }
        header h1 span { color: #38bdf8; }
        header p { color: #94a3b8; font-size: 1.1em; margin-top: 5px; }

        .grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 30px; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .card h2 { font-size: 1.3em; margin-bottom: 20px; font-weight: 500; color: #e2e8f0; }

        label { display: block; font-size: 0.9em; color: #94a3b8; margin: 15px 0 8px; }
        input {
            width: 100%; padding: 14px; border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.6); color: #fff;
            font-size: 1em; outline: none; transition: 0.3s;
        }
        input:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }

        button {
            width: 100%; padding: 15px; margin-top: 25px;
            background: #38bdf8; color: #0f172a;
            border: none; border-radius: 10px;
            font-size: 1.1em; font-weight: 700; cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #0ea5e9; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4); }

        #mensaje {
            margin-top: 20px; padding: 12px; border-radius: 10px;
            text-align: center; font-weight: 500; font-size: 0.9em;
            opacity: 0; transition: 0.4s; transform: translateY(-10px);
        }
        #mensaje.exito { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; opacity: 1; transform: translateY(0); }
        #mensaje.error { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; opacity: 1; transform: translateY(0); }

        /* --- ESTILOS DE EVE (Robot mejorado) --- */
        .eve-container {
            display: flex; justify-content: center; align-items: center;
            height: 140px; margin-bottom: 10px;
        }
        .eve {
            width: 100px; height: 100px;
            background: linear-gradient(145deg, #ffffff, #e2e8f0);
            border-radius: 50% 50% 45% 45%;
            position: relative;
            box-shadow: 0 15px 25px rgba(0,0,0,0.4), inset 0 -5px 15px rgba(0,0,0,0.1);
            animation: float 4s ease-in-out infinite;
            transition: all 0.3s ease;
        }
        /* Cabeza superior */
        .eve::before {
            content: ''; position: absolute; top: -10px; left: 15%;
            width: 70%; height: 30px;
            background: linear-gradient(145deg, #f8fafc, #cbd5e1);
            border-radius: 50px 50px 0 0;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.8);
        }
        /* Visor/Ojos */
        .eve-visor {
            position: absolute; top: 25px; left: 10%;
            width: 80%; height: 35px;
            background: #0f172a;
            border-radius: 20px;
            display: flex; justify-content: center; align-items: center; gap: 15px;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.8);
            overflow: hidden;
        }
        .eye {
            width: 14px; height: 14px;
            background: #1e293b;
            border-radius: 50%;
            transition: all 0.2s ease;
        }
        /* Base/Cuerpo */
        .eve-base {
            position: absolute; bottom: 10px; left: 20%;
            width: 60%; height: 15px;
            background: #cbd5e1;
            border-radius: 10px;
        }
        /* Animaciones de EVE */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* EVE escaneando */
        .eve.scanning { transform: scale(1.1); }
        .eve.scanning .eye {
            background: #38bdf8;
            box-shadow: 0 0 15px #38bdf8, 0 0 5px #fff;
        }
        .eve.scanning .eve-visor::after {
            content: ''; position: absolute; top: 0; left: 0;
            width: 100%; height: 2px; background: #38bdf8;
            box-shadow: 0 0 10px #38bdf8;
            animation: scanline 1s linear infinite;
        }
        @keyframes scanline {
            0% { top: 0; opacity: 1; }
            50% { top: 100%; opacity: 0.5; }
            100% { top: 0; opacity: 1; }
        }

        /* Lista de la base de datos */
        .db-list { margin-top: 20px; max-height: 350px; overflow-y: auto; padding-right: 5px; }
        .db-list::-webkit-scrollbar { width: 6px; }
        .db-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        .db-item {
            background: rgba(15, 23, 42, 0.6);
            border-left: 4px solid #38bdf8;
            padding: 15px; border-radius: 10px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

        .db-item-info { flex: 1; }
        .db-item .key { font-weight: 700; color: #38bdf8; font-family: monospace; font-size: 1.1em; }
        .db-item .value { color: #f1f5f9; margin-top: 4px; }
        .db-item .fecha { font-size: 0.75em; color: #64748b; margin-top: 6px; display: block; }
        
        .btn-del {
            background: rgba(239, 68, 68, 0.1); color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3); padding: 8px 12px; border-radius: 8px;
            cursor: pointer; transition: 0.2s; width: auto; margin: 0;
        }
        .btn-del:hover { background: #ef4444; color: #fff; transform: scale(1.05); }

        .empty { color: #64748b; text-align: center; padding: 30px; font-style: italic; }
        .badge { background: #38bdf8; color: #0f172a; padding: 2px 10px; border-radius: 20px; font-size: 0.75em; margin-left: auto; font-weight: 700; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Panel de Control <span>Redis</span></h1>
            <p>Visualización de datos en tiempo real</p>
        </header>

        <div class="grid">
            <!-- Formulario con EVE -->
            <div class="card">
                <div class="eve-container">
                    <div class="eve" id="eve-robot">
                        <div class="eve-visor">
                            <div class="eye"></div>
                            <div class="eye"></div>
                        </div>
                        <div class="eve-base"></div>
                    </div>
                </div>
                
                <h2 style="text-align: center; margin-bottom: 10px;">Agregar Nuevo Dato</h2>
                <label>Clave (Key)</label>
                <input type="text" id="clave" placeholder="Ej: alumno:01" autocomplete="off">
                <label>Valor (Value)</label>
                <input type="text" id="valor" placeholder="Ej: María López" autocomplete="off">
                <button onclick="guardar()">Guardar en Redis</button>
                <div id="mensaje"></div>
            </div>

            <!-- Lista Dinámica -->
            <div class="card">
                <h2>Base de Datos Actual <span class="badge" id="contador">0</span></h2>
                <div class="db-list" id="lista">
                    <p class="empty">Esperando datos...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const mensajeDiv = document.getElementById('mensaje');
        const eveRobot = document.getElementById('eve-robot');

        async function guardar() {
            const clave = document.getElementById('clave').value.trim();
            const valor = document.getElementById('valor').value.trim();

            if (!clave || !valor) {
                mostrarMensaje('Por favor, completa ambos campos.', 'error');
                return;
            }

            // EVE se activa para escanear
            eveRobot.classList.add('scanning');

            try {
                const res = await fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: clave, value: valor })
                });
                const data = await res.json();
                
                if (data.success) {
                    mostrarMensaje('¡Dato guardado exitosamente!', 'exito');
                    document.getElementById('clave').value = '';
                    document.getElementById('valor').value = '';
                    document.getElementById('clave').focus();
                    cargarLista();
                } else {
                    mostrarMensaje(data.message, 'error');
                }
            } catch (e) {
                mostrarMensaje('Error al conectar con el servidor.', 'error');
            } finally {
                // EVE deja de escanear después de 1.5 segundos
                setTimeout(() => {
                    eveRobot.classList.remove('scanning');
                }, 1500);
            }
        }

        function mostrarMensaje(texto, tipo) {
            mensajeDiv.textContent = texto;
            mensajeDiv.className = tipo;
            setTimeout(() => { mensajeDiv.className = ''; }, 3000);
        }

        async function cargarLista() {
            const lista = document.getElementById('lista');
            const contador = document.getElementById('contador');
            
            try {
                const res = await fetch('/api/list');
                const data = await res.json();

                if (!data.success || data.data.length === 0) {
                    lista.innerHTML = '<p class="empty">Aún no hay datos en la base de datos</p>';
                    contador.textContent = '0';
                    return;
                }

                contador.textContent = data.data.length;
                lista.innerHTML = data.data.map(item => `
                    <div class="db-item">
                        <div class="db-item-info">
                            <div class="key">${escapeHtml(item.key)}</div>
                            <div class="value">${escapeHtml(item.valor || '(vacío)')}</div>
                            <span class="fecha">Guardado el: ${item.fecha}</span>
                        </div>
                        <button class="btn-del" onclick="eliminar('${escapeHtml(item.key)}')">Eliminar</button>
                    </div>
                `).join('');
            } catch (e) {
                lista.innerHTML = '<p class="empty">Error al cargar datos</p>';
            }
        }

        async function eliminar(key) {
            if (!confirm(`¿Estás seguro de eliminar la clave "${key}"?`)) return;
            await fetch('/api/delete/' + encodeURIComponent(key), { method: 'DELETE' });
            cargarLista();
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, s => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            }[s]));
        }

        cargarLista();
        setInterval(cargarLista, 2000); // Se actualiza cada 2 segundos
    </script>
</body>
</html>
