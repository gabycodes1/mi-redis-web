<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redis Studio | Enterprise Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #050810;
            --bg-panel: rgba(13, 19, 36, 0.75);
            --border-glass: rgba(255, 255, 255, 0.06);
            --accent-primary: #0ea5e9;
            --accent-glow: rgba(14, 165, 233, 0.4);
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --font-ui: 'Inter', sans-serif;
            --font-code: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-ui); }
        
        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(14, 165, 233, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(139, 92, 246, 0.05) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Fondo de cuadrícula técnica */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
            z-index: 0;
        }

        /* --- BARRA SUPERIOR (Header) --- */
        header {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid var(--border-glass);
            background: rgba(5, 8, 16, 0.6);
            backdrop-filter: blur(16px);
        }

        .logo { font-size: 1.4rem; font-weight: 700; display: flex; align-items: center; gap: 12px; letter-spacing: -0.03em; }
        .logo-icon { color: var(--accent-primary); font-size: 1.6rem; }
        .logo span { background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .header-stats { display: flex; gap: 30px; }
        .stat-item { display: flex; flex-direction: column; align-items: flex-end; }
        .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
        .stat-value { font-size: 1.1rem; font-weight: 600; font-family: var(--font-code); color: var(--accent-green); }

        /* --- CONTENEDOR PRINCIPAL --- */
        .main-container {
            position: relative;
            z-index: 10;
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 30px;
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 30px;
        }

        @media (max-width: 1024px) { .main-container { grid-template-columns: 1fr; } }

        /* --- TARJETAS (Glassmorphism) --- */
        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .panel-title { font-size: 1.05rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        
        /* --- E.V.E. 3D --- */
        .eve-stage {
            height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            perspective: 1000px;
            background: radial-gradient(circle at center, rgba(14, 165, 233, 0.1) 0%, transparent 60%);
            border-radius: 16px;
            margin-bottom: 10px;
        }

        .eve-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: float 4s ease-in-out infinite;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .eve-head {
            width: 110px; height: 75px;
            background: linear-gradient(145deg, #ffffff, #cbd5e1);
            border-radius: 55px 55px 45px 45px;
            position: relative; z-index: 3;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5), inset 0 -5px 15px rgba(0,0,0,0.1), inset 0 3px 5px #fff;
            display: flex; justify-content: center; align-items: center;
        }

        .eve-visor {
            width: 90px; height: 48px;
            background: radial-gradient(circle at 50% 20%, #1e293b, #020617);
            border-radius: 45px 45px 35px 35px;
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.9), 0 1px 1px rgba(255,255,255,0.5);
            position: relative; overflow: hidden;
            display: flex; justify-content: center; align-items: center; gap: 16px;
        }

        .eve-visor::before {
            content: ''; position: absolute; top: 4px; left: 16px;
            width: 58px; height: 12px; background: rgba(255,255,255,0.15);
            border-radius: 50%;
        }

        .eve-eye {
            width: 24px; height: 16px;
            background: var(--accent-primary);
            border-radius: 50% 50% 40% 40%;
            box-shadow: 0 0 15px var(--accent-primary), 0 0 30px var(--accent-glow);
            transition: all 0.25s; animation: blink 5s infinite;
        }

        .eve-torso {
            width: 100px; height: 120px;
            background: linear-gradient(145deg, #ffffff, #cbd5e1);
            border-radius: 30px 30px 50px 50px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 -10px 15px rgba(0,0,0,0.15);
            position: relative; z-index: 2; margin-top: -5px;
        }

        .eve-arm {
            width: 18px; height: 85px;
            background: linear-gradient(145deg, #fff, #94a3b8);
            border-radius: 10px 10px 20px 20px;
            position: absolute; top: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }
        .eve-arm.left { left: -25px; transform: rotate(10deg); animation: armLeft 4s infinite; }
        .eve-arm.right { right: -25px; transform: rotate(-10deg); animation: armRight 4s infinite; }

        .eve-status {
            font-family: var(--font-code); font-size: 0.8rem; color: var(--accent-primary);
            margin-top: 15px; padding: 6px 16px; border-radius: 20px;
            background: rgba(14, 165, 233, 0.1); border: 1px solid rgba(14, 165, 233, 0.2);
            letter-spacing: 0.05em; transition: all 0.3s;
        }

        /* --- FORMULARIO --- */
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }
        
        input {
            width: 100%; padding: 14px 16px;
            background: rgba(0,0,0,0.4); border: 1px solid var(--border-glass);
            border-radius: 12px; color: #fff; font-family: var(--font-code); font-size: 0.9rem;
            transition: all 0.3s;
        }
        input:focus { border-color: var(--accent-primary); box-shadow: 0 0 0 3px var(--accent-glow); outline: none; background: rgba(0,0,0,0.6); }

        .btn-main {
            width: 100%; padding: 16px; margin-top: 10px;
            background: var(--accent-primary); color: #000;
            border: none; border-radius: 12px; font-size: 1rem; font-weight: 700;
            cursor: pointer; transition: all 0.3s;
            display: flex; justify-content: center; align-items: center; gap: 10px;
            box-shadow: 0 10px 20px -5px var(--accent-glow);
        }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 15px 25px -5px var(--accent-glow); filter: brightness(1.1); }

        /* --- ESTADOS E.V.E. --- */
        .eve-wrapper.scanning { transform: scale(1.05) translateY(-10px); }
        .eve-wrapper.scanning .eve-eye { animation: none; background: #fff; box-shadow: 0 0 20px #fff, 0 0 40px var(--accent-primary); }
        .eve-wrapper.scanning .eve-visor::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: var(--accent-primary); box-shadow: 0 0 15px var(--accent-primary);
            animation: scan 0.6s linear infinite;
        }
        .eve-wrapper.happy .eve-eye { background: transparent; box-shadow: none; border-top: 5px solid var(--accent-green); border-radius: 50% 50% 0 0; animation: none; }
        .eve-wrapper.happy .eve-arm.left { transform: rotate(40deg) translateY(-15px); }
        .eve-wrapper.happy .eve-arm.right { transform: rotate(-40deg) translateY(-15px); }

        /* --- PANEL DERECHO: DATOS --- */
        .toolbar { display: flex; gap: 15px; margin-bottom: 20px; }
        .search-input {
            flex: 1; padding: 12px 20px; border-radius: 12px;
            background: rgba(255,255,255,0.03); border: 1px solid var(--border-glass);
            color: #fff; font-family: var(--font-ui);
        }
        
        .btn-danger {
            padding: 12px 20px; border-radius: 12px;
            background: rgba(239, 68, 68, 0.1); color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3); font-weight: 600;
            cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 8px;
        }
        .btn-danger:hover { background: #ef4444; color: #fff; box-shadow: 0 0 15px rgba(239,68,68,0.4); }

        .db-list { flex: 1; overflow-y: auto; max-height: 500px; padding-right: 10px; display: flex; flex-direction: column; gap: 12px; }
        .db-list::-webkit-scrollbar { width: 6px; }
        .db-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        .db-item {
            background: rgba(0,0,0,0.3); border: 1px solid var(--border-glass);
            border-left: 4px solid var(--accent-primary);
            padding: 18px; border-radius: 12px;
            display: flex; justify-content: space-between; align-items: center;
            transition: all 0.2s;
        }
        .db-item:hover { background: rgba(255,255,255,0.03); border-left-color: #38bdf8; transform: translateX(5px); }

        .key-text { font-family: var(--font-code); color: #38bdf8; font-weight: 600; font-size: 1rem; }
        .value-text { color: var(--text-main); margin-top: 6px; font-size: 0.95rem; }
        .time-text { font-family: var(--font-code); font-size: 0.75rem; color: var(--text-muted); margin-top: 8px; display: flex; align-items: center; gap: 5px; }

        .btn-icon {
            background: transparent; border: none; color: var(--text-muted);
            cursor: pointer; padding: 8px; border-radius: 8px; transition: 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-icon:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-icon.delete:hover { background: rgba(239, 68, 68, 0.2); color: #ef4444; }

        /* --- CONSOLA DE LOGS --- */
        .console-box {
            margin-top: 20px; background: #020617; border: 1px solid var(--border-glass);
            border-radius: 12px; padding: 15px; font-family: var(--font-code); font-size: 0.8rem;
            height: 120px; overflow-y: auto; color: #64748b;
        }
        .log-line { margin-bottom: 4px; }
        .log-line.success { color: var(--accent-green); }
        .log-line.error { color: var(--accent-red); }
        .log-time { color: #475569; margin-right: 8px; }

        /* --- ANIMACIONES --- */
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        @keyframes blink { 0%, 96%, 100% { transform: scaleY(1); } 98% { transform: scaleY(0.1); } }
        @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }
        @keyframes armLeft { 0%, 100% { transform: rotate(10deg); } 50% { transform: rotate(15deg) translateY(-5px); } }
        @keyframes armRight { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(-15deg) translateY(-5px); } }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <span class="logo-icon">◈</span> Redis <span>Studio</span>
        </div>
        <div class="header-stats">
            <div class="stat-item">
                <span class="stat-label">Estado del Clúster</span>
                <span class="stat-value">● ONLINE</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Latencia</span>
                <span class="stat-value" id="latencia">-- ms</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Total Registros</span>
                <span class="stat-value" id="stat-total" style="color: #38bdf8;">0</span>
            </div>
        </div>
    </header>

    <div class="main-container">
        
        <!-- PANEL IZQUIERDO: Entrada de Datos -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">🤖 Asistente E.V.E.</div>
                <span style="font-size: 0.75rem; color: var(--text-muted); font-family: var(--font-code);">v2.0.4</span>
            </div>

            <div class="eve-stage">
                <div class="eve-wrapper" id="eve">
                    <div class="eve-head">
                        <div class="eve-visor">
                            <div class="eve-eye"></div>
                            <div class="eve-eye"></div>
                        </div>
                    </div>
                    <div class="eve-arm left"></div>
                    <div class="eve-torso"></div>
                    <div class="eve-arm right"></div>
                </div>
                <div class="eve-status" id="eve-status">SISTEMA EN ESPERA</div>
            </div>

            <form onsubmit="event.preventDefault(); guardar();">
                <div class="form-group">
                    <label>Identificador (Key)</label>
                    <input type="text" id="clave" placeholder="ej. user:gaby" required>
                </div>
                <div class="form-group">
                    <label>Información (Value)</label>
                    <input type="text" id="valor" placeholder="ej. Gaby - Administradora" required>
                </div>
                <button type="submit" class="btn-main">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                    Guardar en Redis
                </button>
            </form>
        </div>

        <!-- PANEL DERECHO: Base de Datos -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">🗄️ Almacén de Datos en Memoria</div>
                <span style="color: var(--text-muted); font-size: 0.85rem;" id="contador">0 registros</span>
            </div>

            <div class="toolbar">
                <input type="text" class="search-input" id="buscador" placeholder="Filtrar registros por clave o valor..." oninput="filtrar()">
                <button class="btn-danger" onclick="borrarTodo()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    Limpiar Todo
                </button>
            </div>

            <div class="db-list" id="lista">
                <div style="text-align: center; padding: 40px; color: #475569;">Conectando al servidor...</div>
            </div>

            <!-- Consola de Logs -->
            <div class="console-box" id="console">
                <div class="log-line"><span class="log-time">[SYS]</span> Iniciando conexión con Redis Cloud...</div>
            </div>
        </div>
    </div>

    <script>
        let cacheData = [];

        // Manejo de la Interfaz de E.V.E.
        function setEveState(state, text) {
            const eve = document.getElementById('eve');
            const status = document.getElementById('eve-status');
            eve.className = 'eve-wrapper';
            if(state) eve.classList.add(state);
            status.textContent = text;
        }

        // Logs del sistema
        function addLog(msg, type = '') {
            const consoleBox = document.getElementById('console');
            const time = new Date().toLocaleTimeString('es-MX');
            const line = document.createElement('div');
            line.className = `log-line ${type}`;
            line.innerHTML = `<span class="log-time">[${time}]</span> ${msg}`;
            consoleBox.appendChild(line);
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        async function guardar() {
            const clave = document.getElementById('clave').value.trim();
            const valor = document.getElementById('valor').value.trim();
            if(!clave || !valor) return;

            setEveState('scanning', 'ESCANEANDO Y GUARDANDO...');
            addLog(`Guardando <strong style="color:#38bdf8">${clave}</strong> en la nube...`);

            try {
                const start = performance.now();
                const res = await fetch('/api/save', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ key: clave, value: valor })
                });
                const data = await res.json();
                const ms = Math.round(performance.now() - start);
                
                document.getElementById('latencia').textContent = `${ms} ms`;

                if(data.success) {
                    setEveState('happy', '¡REGISTRO GUARDADO!');
                    addLog('OK: Registro guardado exitosamente.', 'success');
                    document.getElementById('clave').value = '';
                    document.getElementById('valor').value = '';
                    cargarLista();
                } else {
                    setEveState('', 'ERROR AL GUARDAR');
                    addLog(`ERROR: ${data.message}`, 'error');
                }
            } catch (e) {
                setEveState('', 'SIN CONEXIÓN');
                addLog('CRÍTICO: Error al conectar con el backend.', 'error');
            } finally {
                setTimeout(() => setEveState('', 'SISTEMA EN ESPERA'), 2500);
            }
        }

        async function cargarLista() {
            try {
                const res = await fetch('/api/list');
                const data = await res.json();
                if(data.success) {
                    cacheData = data.data;
                    filtrar();
                }
            } catch (e) {
                addLog('Error al obtener la lista de datos.', 'error');
            }
        }

        function filtrar() {
            const term = document.getElementById('buscador').value.toLowerCase();
            const filtrados = cacheData.filter(i => 
                i.key.toLowerCase().includes(term) || 
                String(i.valor).toLowerCase().includes(term)
            );
            render(filtrados);
        }

        function render(datos) {
            const lista = document.getElementById('lista');
            const cont = document.getElementById('contador');
            const total = document.getElementById('stat-total');
            
            cont.textContent = `${cacheData.length} registros`;
            total.textContent = cacheData.length;

            if(datos.length === 0) {
                lista.innerHTML = `<div style="text-align: center; padding: 40px; color: #475569;">No se encontraron registros.</div>`;
                return;
            }

            lista.innerHTML = datos.map(item => `
                <div class="db-item">
                    <div>
                        <div class="key-text">${escapeHtml(item.key)}</div>
                        <div class="value-text">${escapeHtml(item.valor || '')}</div>
                        <div class="time-text">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                            ${escapeHtml(item.fecha)}
                        </div>
                    </div>
                    <div>
                        <button class="btn-icon delete" onclick="eliminar('${escapeHtml(item.key)}')" title="Eliminar registro">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        async function eliminar(key) {
            if(!confirm(`¿Eliminar la clave "${key}"?`)) return;
            addLog(`Eliminando clave ${key}...`);
            await fetch('/api/delete/' + encodeURIComponent(key), { method: 'DELETE' });
            addLog(`Clave ${key} eliminada.`, 'success');
            cargarLista();
        }

        async function borrarTodo() {
            if(!confirm('¡PELIGRO! ¿Estás seguro de que quieres borrar TODA la base de datos?')) return;
            addLog('Iniciando purga total de la base de datos...', 'error');
            
            // Esto asume que tienes una ruta para borrar todo. 
            // Si no la tienes en tu server.js, haremos un bucle para borrar uno por uno.
            for (const item of cacheData) {
                await fetch('/api/delete/' + encodeURIComponent(item.key), { method: 'DELETE' });
            }
            addLog('Base de datos vaciada por completo.', 'success');
            cargarLista();
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, s => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[s]));
        }

        // Inicializar
        addLog('Conexión establecida con Redis.');
        cargarLista();
        setInterval(cargarLista, 3000);
    </script>
</body>
</html>
